[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-system"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "growwapi==1.5.0",
  "httpx==0.28.1",
  "alembic==1.19.1",
  "psycopg[binary]==3.3.4",
  "psycopg-pool==3.3.1",
  "pydantic-settings==2.15.0",
  "pyotp==2.10.0",
  "redis==8.1.0",
  "uvicorn==0.52.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "mypy==1.18.2", "ruff==0.13.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL and Redis",
  "live: requires local Groww credentials and subscription",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
packages = ["trading_system"]
check_untyped_defs = true
ignore_missing_imports = true
